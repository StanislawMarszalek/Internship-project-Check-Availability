{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">

        <h2>Reset password</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
                Send reset link
            </button>
        </form>

    </div>
</div>
{% endblock %}
