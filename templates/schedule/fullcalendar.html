{% extends "base.html" %}
{% load i18n %}

{% block head_title %}
    {{ object.name }}
{% endblock %}

{% block extra_head %}

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
    #calendar {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .fc {
        font-family: inherit;
    }

    .fc-toolbar-title {
        font-size: 1.4rem !important;
    }

    .fc-button {
        border-radius: 6px !important;
    }
</style>

{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="mb-1">
            {{ object.name }}
        </h2>

        <p class="text-muted mb-0">
            Calendar
        </p>

    </div>
    <div class="d-flex gap-2 align-items-centerr">
        <a href="{% url 'calendar_create_event' calendar_slug %}" class="btn btn-primary">
            <i class="bi bi-plus-lg align-center"></i>
            Add event
        </a>
        <a href="{% url 'availability:rooms_list' %}" class="btn btn-info" >Back</a>
    </div>

</div>

<div id="calendar"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const calendarEl = document.getElementById("calendar");

    const calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: "dayGridMonth",

        headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,timeGridDay"
        },

        firstDay: 1,
        height: "auto",
        editable: false,
        selectable: true,
        dayMaxEvents: true,
        eventOverlap: false,
        selectOverlap: false,

        events: "{% url 'api_occurrences' %}?calendar_slug={{ calendar_slug }}",

        eventClick: function(info) {

            const eventId = info.event.extendedProps.event_id;

            window.location.href =
                "{% url 'event' 12345 %}".replace(
                    "12345",
                    eventId
                );
        }

    });

    calendar.render();

});
</script>

{% endblock %}
