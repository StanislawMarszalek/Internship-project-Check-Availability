{% extends "base.html" %}

{% block content %}

<h2 class="h5 mb-3">Mark worker as absent</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">
            Save change
        </button>

        <a href="{% url 'availability:workers_list' %}"
           class="btn btn-secondary">
            Back
        </a>
    </div>
</form>

{% endblock %}
