{% extends "base.html" %}

{% block content %}
<style>
    .errorlist {
        color: #dc3545;
        font-weight: bold;
        margin: 5px 0;
        padding-left: 0;
        list-style: none;
    }
</style>

<h2 class="h5 mb-3">Mark worker as absent</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">
            Save change
        </button>

        <a href="{% url 'availability:workers_list' %}"
           class="btn btn-secondary">
            Back
        </a>
    </div>
</form>

{% endblock %}
