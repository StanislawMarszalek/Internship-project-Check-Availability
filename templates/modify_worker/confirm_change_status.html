{% extends "base.html" %}

{% block content %}

<h2 class="h5 mb-3">Change status</h2>

<p>
    Are you sure you want to change status?
</p>

<p>
    Actual status:
    <strong>
        {% if worker.is_present %}
            Present
        {% else %}
            Absent
        {% endif %}
    </strong>
</p>

<a href="{% url 'availability:change_worker_status' worker.pk %}"
   class="btn btn-danger">
    Yes, change
</a>

<a href="{% url 'availability:workers_list' %}"
   class="btn btn-secondary">
    No, return to the list
</a>

{% endblock %}
